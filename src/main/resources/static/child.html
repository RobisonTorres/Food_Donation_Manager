<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Children</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="child.js" defer></script>
</head>
<body>
    <h1>All Children</h1>
    <p id="active-children"></p>
    <div>
    <div id="showAllFamilies" class="row g-3"></div>
    <template id="family-child-card-template">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow h-100 border-success">
            <div class="card-body d-flex flex-column">

                <h5 class="card-title text-center text-success mb-4">
                    <i class="fas fa-users me-2"></i>
                    <span class="family-name"></span>
                </h5>

                <p class="card-text mb-2">
                    <i class="fas fa-location-dot me-2 text-muted"></i>
                    <strong>Address:</strong>
                    <span class="family-address"></span>
                </p>

                <p class="card-text mb-3">
                    <i class="fas fa-phone me-2 text-muted"></i>
                    <strong>Phone:</strong>
                    <span class="family-phone"></span>
                </p>

                <hr>

                <h6 class="text-primary mb-3">
                    <i class="fas fa-child me-2"></i>
                    Children
                </h6>

                <ul class="list-group child-list flex-grow-1">
                    <!-- Inserir via JavaScript -->
                </ul>

            </div>
        </div>
    </div>
</template>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
