<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Children</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="./scripts/child.js" defer></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
    <div class="container">
      <h1 class="navbar-brand fw-bold mb-0 d-flex align-items-center">
        <i class="bi bi-box-seam me-2 text-success"></i> Food Manager
      </h1>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item"><a class="nav-link px-3" href="/index.html">Donations</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="family.html">Families</a></li>
          <li class="nav-item"><a class="nav-link active px-3 rounded bg-secondary bg-opacity-25" href="child.html">Children</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="/cards.html">Cards</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="fw-bold text-dark mb-1">All Children</h1>
        <p class="text-muted mb-0">List of minors connected to registered families</p>
      </div>
      <div class="bg-white px-4 py-3 rounded-4 shadow-sm border border-light-subtle text-center">
        <span class="text-muted small text-uppercase fw-semibold tracking-wider d-block mb-1">Total Children</span>
        <span id="active-children" class="fs-3 fw-bold text-success">0</span>
      </div>
    </div>

    <div class="bg-white rounded-4 shadow-sm border border-light-subtle overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="py-3 text-muted small text-center tracking-wider">N°</th>
              <th class="py-3 ps-4 text-muted small text-uppercase fw-semibold tracking-wider">Child Name</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider text-center" style="width: 120px;">Age</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider">Responsible Family</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider">Contact Phone</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider pe-4">Address</th>
            </tr>
          </thead>
          <tbody id="showAllChildren">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <template id="family-child-row-template">
    <tr class="border-bottom">
      <td class="py-3 ps-4">
        <div class="fw-bold text-dark fs-6 child-number"></div>
      </td>
      <td class="py-3 ps-4">
        <div class="fw-bold text-dark fs-6 child-name"></div>
      </td>
      <td class="py-3 text-center">
        <span class="badge bg-success bg-opacity-10 text-success fw-semibold px-3 py-2 rounded-pill child-age"></span>
      </td>
      <td class="py-3">
        <span class="fw-medium text-dark family-name"></span>
      </td>
      <td class="py-3 text-muted small">
        <i class="fas fa-phone me-1 opacity-75"></i> <span class="family-phone"></span>
      </td>
      <td class="py-3 pe-4 text-secondary small">
        <span class="family-address"></span>
      </td>
    </tr>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
