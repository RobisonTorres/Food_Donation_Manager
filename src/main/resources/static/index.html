<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Manager | Donations</title>
  <link href="style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="script_index.js" defer></script>
</head>
<body class="bg-light">
  <div class="container-fluid">
    <div class="row">
      <!-- SIDEBAR -->
      <aside class="col-md-2 bg-dark text-white vh-500 p-0 shadow">
        <div class="p-4 border-bottom">
          <h4 class="fw-bold mb-0">
            <i class="bi bi-box-seam"></i> Food Manager
          </h4>
        </div>
        <div class="list-group list-group-flush">
          <a href="index.html" class="list-group-item list-group-item-action">
            <i class="bi bi-box2-heart me-2"></i> Donations
          </a>
          <a href="/family.html" class="list-group-item list-group-item-action">
            <i class="bi bi-people me-2"></i> Families
          </a>
          <a href="/child.html" class="list-group-item list-group-item-action">
            <i class="bi bi-person-heart me-2"></i> Children
          </a>
          <a href="/cards.html" class="list-group-item list-group-item-action">
            <i class="bi bi-person-heart me-2"></i> Cards
          </a>
        </div>
      </aside>
      <!-- CONTENT -->
      <main class="col-md-10">
        <!-- TOP BAR -->
        <div class="d-flex justify-content-between align-items-center bg-white shadow-sm p-3 mb-4">
          <div>
            <h3 class="mb-1">Monthly Donations</h3>
            <small class="text-muted">Manage monthly food deliveries.</small>
          </div>
          <div id="date" class="fw-semibold fs-5"></div>
        </div>
        <!-- CARDS -->
        <div class="row mb-4">
          <div class="col-lg-4 mb-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <small class="text-muted">Registered Families</small>
                <h2 id="totalFamilies">0</h2>
              </div>
            </div>
          </div>
          <div class="col-lg-4 mb-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <small class="text-muted">Delivered</small>
                <h2 id="totalDelivered" class="text-success">0</h2>
              </div>
            </div>
          </div>
          <div class="col-lg-4 mb-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <small class="text-muted">Pending</small>
                <h2 id="totalPending" class="text-danger">0</h2>
              </div>
            </div>
          </div>
        </div>
   <!-- TABLE -->
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white">
            <h5 class="mb-0">Donation List</h5>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="text-center">Number</th>
                  <th class="text-center">Family</th>
                  <th class="text-center">Status</th>
                  <th class="text-center">Delivery Date</th>
                  <th class="text-center">More Info</th>
                </tr>
              </thead>
              <tbody id="familyTableNewBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div>
  <!-- TEMPLATE -->
  <template id="familyRowTemplate">
    <tr class="family-status">
      <td class="family-id" hidden></td>
      <td class="family-number fw-semibold text-center"></td>
      <td class="family-name fw-semibold text-left" ></td>
      <td class="text-center">
        <select class="form-select form-select-sm family-select mx-auto" style="max-width: 150px;">
          <option value="PENDENT">❌ PENDENT</option>
          <option value="OK">✅ OK</option>
        </select>
      </td>
      <td class="family-delivery text-muted text-center"></td>
      <td class="family-info">
        <button type="button"
                    class="btn btn-primary btn-sm"
                    >
                <i class="fas fa-plus me-1"></i>
                Family's Info
            </button>
      </td>
    </tr>
  </template>
  </div>
  <div id="showFamily" class="form-popup" 
    style="display:none; max-width:400px;">
    
  </div>

  <template id="info-template">

      <div class="card-info-container">
      <h5 class="card-title text-center text-success mb-4">
                    <i class="fas fa-users me-2"></i>
                    <span id="family-name-show"></span>
                </h5>

                <p class="card-text mb-2">
                    <i class="fas fa-location-dot me-2 text-muted"></i>
                    <strong>Address:</strong>
                    <span id="family-address-show"></span>
                </p>

                <p class="card-text mb-2">
                    <i class="fas fa-phone me-2 text-muted"></i>
                    <strong>Phone:</strong>
                    <span id="family-phone-show"></span>
                </p>

                <p class="card-text mb-2">
                    <i class="fas fa-user-group me-2 text-muted"></i>
                    <strong>Residents:</strong>
                    <span id="family-residents-show"></span>
                </p>
                <hr>
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <th>Month</th>
                    <th>Status</th>
                    <th>Day</th>
                  </thead>
                  <tbody id="family-donation-show">
                      
                  </tbody>
                </table>
                <button type="button" class="btn btn-outline-primary flex-grow-1" onclick="closeForm()">
                  Close
                </button>
              </div>
    </template>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
