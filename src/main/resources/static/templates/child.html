<div>
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="fw-bold text-dark mb-1">All Children</h1>
        <p class="text-muted mb-0">List of minors connected to registered families</p>
      </div>
      <div class="bg-white px-4 py-3 rounded-4 shadow-sm border border-light-subtle text-center">
        <span class="text-muted small text-uppercase fw-semibold tracking-wider d-block mb-1">Total Children</span>
        <span id="active-children" class="fs-3 fw-bold text-success">0</span>
      </div>
    </div>

    <div class="bg-white rounded-4 shadow-sm border border-light-subtle overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="py-3 text-muted small text-center tracking-wider">N°</th>
              <th class="py-3 ps-4 text-muted small text-uppercase fw-semibold tracking-wider">Child Name</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider text-center" style="width: 120px;">Age</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider">Responsible Family</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider">Contact Phone</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider pe-4">Address</th>
            </tr>
          </thead>
          <tbody id="showAllChildren">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <template id="family-child-row-template">
    <tr class="border-bottom">
      <td class="py-3 ps-4">
        <div class="fw-bold text-dark fs-6 child-number"></div>
      </td>
      <td class="py-3 ps-4">
        <div class="fw-bold text-dark fs-6 child-name"></div>
      </td>
      <td class="py-3 text-center">
        <span class="badge bg-success bg-opacity-10 text-success fw-semibold px-3 py-2 rounded-pill child-age"></span>
      </td>
      <td class="py-3">
        <span class="fw-medium text-dark family-name"></span>
      </td>
      <td class="py-3 text-muted small">
        <i class="fas fa-phone me-1 opacity-75"></i> <span class="family-phone"></span>
      </td>
      <td class="py-3 pe-4 text-secondary small">
        <span class="family-address"></span>
      </td>
    </tr>
  </template>
</div>
