<div>
  <div class="container my-4">
    
    <div class="bg-white rounded-4 shadow-sm border border-light-subtle p-4 mb-4 no-print">
      <div class="row align-items-center g-3">
      
        <div class="col-12 col-md">
          <div class="d-flex align-items-center gap-3">
            <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-3 fs-3 d-flex align-items-center justify-content-center">
              <i class="bi bi-people-fill"></i>
            </div>
            <div>
              <small class="text-muted text-uppercase fw-semibold tracking-wider">Total Children</small>
              <h2 id="active-children" class="fw-bold text-dark mb-0 fs-3">0</h2>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-auto d-flex justify-content-md-end">
          <button onclick="hideAndPrint()" class="btn btn-success d-flex align-items-center gap-2 px-4 py-2 rounded-3 shadow-sm fw-semibold">
            <i class="bi bi-printer-fill"></i> Print Table
          </button>
        </div>

      </div>
    </div>

    <div class="bg-white rounded-4 shadow-sm border border-light-subtle overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="py-3 ps-4 text-muted small text-center text-uppercase fw-semibold tracking-wider" style="width: 70px;">N°</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider">Child Name</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider text-center" style="width: 120px;">Age</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider">Responsible Family</th>
              <th class="py-3 text-muted small text-uppercase fw-semibold tracking-wider">Contact Phone</th>
              <th class="py-3 pe-4 text-muted small text-uppercase fw-semibold tracking-wider">Address</th>
            </tr>
          </thead>
          <tbody id="showAllChildren">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <template id="family-child-row-template">
    <tr class="border-bottom">
      <td class="py-3 ps-4 text-center">
        <div class="fw-bold text-muted small child-number"></div>
      </td>
      <td class="py-3">
        <div class="fw-bold text-dark fs-6 child-name"></div>
      </td>
      <td class="py-3 text-center">
        <span class="badge bg-success bg-opacity-10 text-success fw-semibold px-3 py-2 rounded-pill child-age"></span>
      </td>
      <td class="py-3">
        <span class="fw-medium text-dark family-name"></span>
      </td>
      <td class="py-3 text-muted small">
        <i class="bi bi-telephone-fill me-1 opacity-75"></i> <span class="family-phone"></span>
      </td>
      <td class="py-3 pe-4 text-secondary small">
        <span class="family-address"></span>
      </td>
    </tr>
  </template>
</div>
